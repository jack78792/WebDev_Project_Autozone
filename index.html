<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>Wheels on Fire</title>

        <h1>Wheels on Fire</h1>

        <p>Used Cars</p>
        <p>Dealers</p>
        <p>Saved</p>
        <p>Sell</p>

        <h3>Login</h3>
    </head>

    <body>
        <img src="https://images.unsplash.com/photo-1729966085578-c7b281cf11da?q=80&w=1171&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Car of the week (BMW M5)" width="800" height="525"/>
        
        <input id="car-search", placeholder="Search make, model, or keyword">
        <img src="https://cdn-icons-png.magnific.com/512/12048/12048671.png?fd=1&filename=search_12048671.png"/ width="40" height="40">
    
        <!-- Dropdown menu for filtering -->
        <details>
            <summary>Filter</summary>
            <div>
                <div>Max year: 2020</div>
                <input type="range" id="year" min="1990" max="2026" value="2020">

                <div>Max price: $25,000</div>
                <input type="range" id="max-price" min="0" max="10000000" value="20000">

                <div>Min price: $15,000</div>
                <input type="range" id="max-price" min="0" max="10000000" value="10000">
            </div>
        </details>

        <img src="https://cdn-icons-png.flaticon.com/512/107/107799.png" width="20" height="20">

        <!-- Dropdown menu for sorting -->
        <details>
            <summary>Sort</summary>
            <div>
                <button>Price: Low to High</button>
                <button>Price: High to Low</button>
                <button>Alphabetically: A - Z</button>
                <button>Alphabetically: Z - A</button>
            </div>
        </details>

        <img src="https://cdn-icons-png.flaticon.com/512/130/130898.png" width="20" height="20">
    </body>
</html>
